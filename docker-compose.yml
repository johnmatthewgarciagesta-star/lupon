services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lupon-app:latest
    container_name: lupon-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "${APP_NAME:-Lupon}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"

      # Database configuration
      DB_CONNECTION: "mysql"
      DB_HOST: "n5n3wvoxv2rh7nvycxzzvy2v"
      DB_PORT: "3306"
      DB_DATABASE: "default"
      DB_USERNAME: "mysql"
      DB_PASSWORD: "mysql-sean"
      DB_URL: "mysql://mysql:mysql-sean@n5n3wvoxv2rh7nvycxzzvy2v:3306/default"

      # Sessions and Cache
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"

      # Spatie Browsershot & Chromium
      CHROME_PATH: "/usr/bin/chromium"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      # Inertia SSR
      INERTIA_SSR_ENABLED: "${INERTIA_SSR_ENABLED:-false}"

      # Run database migrations on start
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - coolify
      - default

volumes:
  storage_data:
  bootstrap_cache:

networks:
  coolify:
    name: coolify
    external: true
  default:
